# Benchmark smoke: 1 family x 1 variation x 1 mode x 1 task x 1 seed.
# Quick sanity that codegen + the in-process sim eval handle the
# grocery-packing scene (teleport-on-In success) without surprises.
#
#   gap benchmark examples/benchmark/smoke.yaml
#
task: "auto"   # per-task prompts resolved from LIBERO metadata

# open-robot-skills checkout (bundle discovery root) — codegen registries are
# built from it. OPTIONAL: omit the key entirely to auto-discover the
# checkout ($GAP_SKILLS_PATH or an open-robot-skills directory next to the gap
# repo). Explicit relative values resolve against this file's directory.
skills: ../../../open-robot-skills

llm:
  provider: vertex
  model: claude-opus-4-8
  project_id: autolab-res

benchmark:
  families: [grocery_packing]
  variations: [object]
  modes: [llm_generation]
  n_tasks: 1
  task_ids: [0]
  n_seeds: 10          # ← 10 trials instead of 1
  num_workers: 1       # single 24GB GPU: one worker's stack (sam3+dino+curobo+sim) ~fills it; 2 workers OOM
  record_video: true
  smoke: true
  output_dir: ../../benchmark_runs/smoke
safety_limits:
  max_planning_calls: 100   # keep what you added, or the clean-all loop trips the guard