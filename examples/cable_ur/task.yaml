# Task metadata for the UR + ZED cable-perception example.
# (Ported from the dev tree's cable task config; the dev benchmark-harness
# fields — platform base, startup timeouts — do not apply here.)

task: "Locate the white tape on the cable and report its 3D position."

suite: ur_zed

environment:
  cameras:
    - zed_left

run:
  graph: graph/
